# curve = "easeout"

# Present animation preset
[animation]
enabled = true
duration_ms = 120
curve = "easeout"

[animation.windows_in]
enabled = false

[animation.windows_out]
enabled = false

[animation.windows_move]
enabled = true
duration_ms = 120
curve = "snappy"

[animation.workspaces]
enabled = true
duration_ms = 120
curve = "easeout"

[animation.overview]
enabled = true
duration_ms = 140
curve = "easeout"

[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 14
drag_opacity = 0.8

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2
color = "#0000007F"

[overview]
zoom = 0.5
background_blur = true

[hot_corners.top_left]
enabled = false
delay_ms = 500
action = "overview-open"

[layout]
mode = "scrolling"
gap = 12
width_presets = [0.333, 0.5, 0.667]

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.scrolling]
default_width_fraction = 0.5
center_underfull_strip = true
center_focused = false
expand_single_column = false

[input]
middle_click_paste = true

[input.keyboard]
layout = ""
variant = ""
options = ""
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true
track_layout = "global"

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
sensitivity = 0.0

[input.cursor]
theme = "capitaine-cursors"
size = 24
hardware_cursor = true
follows_focus = false
hide_when_typing = true
hide_timeout_ms = 0

[input.focus]
follows_mouse = true

# Ported from the existing Niri display config. Adjust or remove this table if
# the connector/mode changes on another machine.
[output."DP-1"]
mode = "2560x1440@359.979"
scale = 1.0
