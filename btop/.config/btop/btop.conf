# Focused btop layout for interactive monitoring.

color_theme = "tokyonight"
theme_background = true
truecolor = true
force_tty = false

shown_boxes = "cpu mem net proc"
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default cpu:0:default,proc:0:default"
vim_keys = true
disable_mouse = false
rounded_corners = true
terminal_sync = true

graph_symbol = "braille"
graph_symbol_cpu = "default"
graph_symbol_mem = "default"
graph_symbol_net = "default"
graph_symbol_proc = "default"
update_ms = 2000

proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
proc_cpu_graphs = true
proc_info_smaps = false
proc_left = false
proc_filter_kernel = true
proc_follow_detailed = true

cpu_graph_upper = "Auto"
cpu_graph_lower = "Auto"
show_gpu_info = "Auto"
cpu_invert_lower = true
cpu_single_graph = false
cpu_bottom = false
show_uptime = true
show_cpu_watts = true
check_temp = true
cpu_sensor = "Auto"
show_coretemp = true
temp_scale = "celsius"
show_cpu_freq = true
freq_mode = "average"

# The desktop shell already provides a clock.
clock_format = ""
background_update = true

mem_graphs = true
mem_below_net = false
show_swap = true
swap_disk = false
show_disks = true
only_physical = true
use_fstab = false
show_io_stat = true
io_mode = false

swap_upload_download = false
net_auto = true
net_sync = true
net_iface = ""
show_battery = true
selected_battery = "Auto"
show_battery_watts = true

save_config_on_exit = true
log_level = "WARNING"
