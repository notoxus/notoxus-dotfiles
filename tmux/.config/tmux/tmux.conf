# ═══════════════════════════════════════════════════════════════════
#  tmux.conf · Arch Linux · Tokyo Night
#  Managed via dotfiles (install.sh). Glyphs require a Nerd Font.
#  Lives at ~/.config/tmux/tmux.conf (XDG); tpm auto-detects this and
#  installs plugins under ~/.config/tmux/plugins/ instead of ~/.tmux/.
# ═══════════════════════════════════════════════════════════════════

# ── Palette (Tokyo Night) ──────────────────────────────────────────
set -g @thm_fg      "#c0caf5"
set -g @thm_crust   "#16161e"
set -g @thm_surface "#24283b"
set -g @thm_overlay "#565f89"
set -g @thm_muted   "#9aa5ce"
set -g @thm_blue    "#7aa2f7"
set -g @thm_mauve   "#bb9af7"
set -g @thm_yellow  "#e0af68"
set -g @thm_peach   "#ff9e64"
set -g @thm_green   "#9ece6a"
set -g @thm_red     "#f7768e"

# ── Terminal & performance ─────────────────────────────────────────
set  -g default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc"      # truecolor
set  -ga terminal-features ",*:usstyle"         # undercurl support
set  -s  escape-time 10                          # no ESC lag in vim/nvim
set  -s  repeat-time 1000                        # allow held repeatable bindings to engage
set  -g  focus-events on
set  -g  history-limit 50000
set  -g  display-time 1500
set  -g  status-interval 5
set  -s  set-clipboard external                  # copy-mode yank -> outer clipboard
setw -g  aggressive-resize on
set  -g  allow-passthrough on                    # image / graphics protocols

# ── Behaviour & workflow defaults ──────────────────────────────────
set  -g  mouse on
set  -g  base-index 1                            # windows start at 1
setw -g  pane-base-index 1
set  -g  renumber-windows on                     # no gaps in window indexes
set  -g  detach-on-destroy off                   # stay attached when a session closes
set  -g  set-titles on
set  -g  set-titles-string "#S · #W"
setw -g  mode-keys vi

# ═══════════════════════════════════════════════════════════════════
#  Keybindings   (prefix stays C-b)
#
#  Custom bindings are tagged with [mine].
#  This allows:
#    tmux list-keys -N -T prefix
#  or a helper script to display only personal keybindings.
# ═══════════════════════════════════════════════════════════════════

# ── Config ────────────────────────────────────────────────────────
bind -N "[mine] Reload tmux config" \
  r source-file ~/.config/tmux/tmux.conf \; display " tmux.conf reloaded"


# ── Windows ───────────────────────────────────────────────────────
# New windows inherit the current pane's working directory.
bind -N "[mine] New window" \
  c new-window -c "#{pane_current_path}"

bind -N "[mine] Previous window" \
  p previous-window

bind -N "[mine] Next window" \
  n next-window

bind -N "[mine] Last window" \
  Tab last-window

bind -N "[mine] Select window 1" 1 select-window -t 1
bind -N "[mine] Select window 2" 2 select-window -t 2
bind -N "[mine] Select window 3" 3 select-window -t 3
bind -N "[mine] Select window 4" 4 select-window -t 4
bind -N "[mine] Select window 5" 5 select-window -t 5
bind -N "[mine] Select window 6" 6 select-window -t 6
bind -N "[mine] Select window 7" 7 select-window -t 7
bind -N "[mine] Select window 8" 8 select-window -t 8
bind -N "[mine] Select window 9" 9 select-window -t 9

bind -N "[mine] Kill current window" \
  X kill-window


# ── Panes ─────────────────────────────────────────────────────────
# Replace the default split shortcuts.
unbind '"'
unbind %

# Splits inherit the current pane's working directory.
bind -N "[mine] Split pane horizontally" \
  | split-window -h -c "#{pane_current_path}"

bind -N "[mine] Split pane vertically" \
  - split-window -v -c "#{pane_current_path}"

# Vim-style navigation.
bind -N "[mine] Focus pane left" \
  h select-pane -L

bind -N "[mine] Focus pane down" \
  j select-pane -D

bind -N "[mine] Focus pane up" \
  k select-pane -U

bind -N "[mine] Focus pane right" \
  l select-pane -R

# Repeatable resize.
bind -r -N "[mine] Resize pane left" \
  H resize-pane -L 5

bind -r -N "[mine] Resize pane down" \
  J resize-pane -D 5

bind -r -N "[mine] Resize pane up" \
  K resize-pane -U 5

bind -r -N "[mine] Resize pane right" \
  L resize-pane -R 5

bind -N "[mine] Next pane layout" \
  Space next-layout

bind -N "[mine] Toggle pane zoom" \
  z resize-pane -Z

bind -N "[mine] Kill current pane" \
  x kill-pane


# ── Popup / scratch ────────────────────────────────────────────────
bind -N "[mine] Open scratch session" \
  s display-popup -E -w 75% "tmux new-session -A -s scratch"


# ── Copy mode ─────────────────────────────────────────────────────
bind -N "[mine] Enter copy mode" \
  Enter copy-mode

bind -T copy-mode-vi -N "[mine] Begin selection" \
  v send -X begin-selection

bind -T copy-mode-vi -N "[mine] Toggle rectangle selection" \
  C-v send -X rectangle-toggle

bind -T copy-mode-vi -N "[mine] Yank selection" \
  y send -X copy-selection-and-cancel

# Plain mouse drag selects in tmux and copies to the outer clipboard on
# release. Use Shift+drag when native Ghostty selection is preferable.
bind -T copy-mode-vi -N "[mine] Copy mouse selection" \
  MouseDragEnd1Pane send -X copy-selection-and-cancel

bind -T copy-mode-vi -N "[mine] Exit copy mode" \
  Escape send -X cancel

# ═══════════════════════════════════════════════════════════════════
#  Status bar
# ═══════════════════════════════════════════════════════════════════
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#{@thm_fg}"
set -g status-left-length 100
set -g status-right-length 200
set -g message-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g mode-style    "bg=#{@thm_mauve},fg=#{@thm_crust}"

# Pane borders
set -g pane-border-style        "fg=#{@thm_surface}"
set -g pane-active-border-style "fg=#{@thm_blue}"

# ── Left: session name (peach + lock glyph while prefix is held) ────
set -g status-left \
"#[fg=#{?client_prefix,#{@thm_peach},#{@thm_blue}},bg=default]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_peach},#{@thm_blue}},bold] #{?client_prefix,,} #[fg=#{?client_prefix,#{@thm_peach},#{@thm_blue}},bg=#{@thm_surface}] #S #[fg=#{?client_prefix,#{@thm_peach},#{@thm_blue}},bg=default] "

# ── Windows ────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-format \
"#[fg=#{@thm_surface},bg=default]#[fg=#{@thm_muted},bg=#{@thm_surface}] #I #[fg=#{@thm_overlay}]#W #[fg=#{@thm_surface},bg=default] "
set -g window-status-current-format \
"#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #I #[fg=#{@thm_fg},bg=#{@thm_surface}] #W#{?window_zoomed_flag, 󰊓,} #[fg=#{@thm_surface},bg=default] "

# ── Right: greeting · weather · cpu · ram · clock ──────────────────
set -g status-right ""
set -ag status-right "#[fg=#{@thm_overlay},bg=default,italics]#(~/.config/tmux/status-msg.sh '#{pane_current_command}')#[none] "
set -ag status-right "#[fg=#{@thm_yellow},bg=default]#[fg=#{@thm_crust},bg=#{@thm_yellow},bold]󰔏 #[fg=#{@thm_yellow},bg=#{@thm_surface}] #(~/.config/tmux/weather.sh) #[fg=#{@thm_surface},bg=default] "
set -ag status-right "#[fg=#{@thm_peach},bg=default]#[fg=#{@thm_crust},bg=#{@thm_peach},bold] #[fg=#{@thm_peach},bg=#{@thm_surface}] #{cpu_percentage} #[fg=#{@thm_surface},bg=default] "
set -ag status-right "#[fg=#{@thm_green},bg=default]#[fg=#{@thm_crust},bg=#{@thm_green},bold] #[fg=#{@thm_green},bg=#{@thm_surface}] #{ram_percentage} #[fg=#{@thm_surface},bg=default] "
set -ag status-right "#[fg=#{@thm_mauve},bg=default]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold]󰥔 #[fg=#{@thm_mauve},bg=#{@thm_surface}] %d/%m %H:%M #[fg=#{@thm_surface},bg=default]"

# ═══════════════════════════════════════════════════════════════════
#  Plugins (tpm)   — install: prefix + I   ·   update: prefix + U
# ═══════════════════════════════════════════════════════════════════
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore

set -g @cpu_percentage_format "%2.1f%%"
set -g @ram_percentage_format "%2.0f%%"

# Session persistence across reboots
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Keep periodic recovery snapshots, but restore only when explicitly requested
# with prefix + C-r. A deliberately killed session must stay dead.
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

run '~/.config/tmux/plugins/tpm/tpm'
