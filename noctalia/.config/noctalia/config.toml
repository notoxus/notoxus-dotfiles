# Noctalia v5 configuration.

[shell]
corner_radius_scale = 1.0
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = false

# Present animation preset
[shell.animation]
enabled = true
speed = 2.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.panel]
transparency_mode = "soft"
borders = true
shadow = true
launcher_placement = "floating"
clipboard_placement = "floating"
control_center_placement = "attached"
open_near_click_control_center = true
wallpaper_placement = "attached"
session_placement = "floating"
launcher_position = "center"

[shell.launcher]
categories = false
show_icons = true
compact = false
app_grid = false
sort_by_usage = true
pinned = []

[wallpaper]
enabled = true
fill_mode = "crop"

transition = ["fade", "wipe", "disc", "stripes", "zoom", "honeycomb"]
transition_duration = 1500

transition_on_startup = false
directory = "~/Pictures/Wallpapers"

# Keep the normal wallpaper stationary inside Niri's overview backdrop.
[backdrop]
enabled = false

[theme]
mode = "dark"
source = "builtin"
builtin = "Tokyo-Night"

[notification]
enable_daemon = true
background_opacity = 0.97

[lockscreen]
enabled = true
blurred_desktop = false
blur_intensity = 0.35
tint_intensity = 0.4

[idle]
behavior_order = ["lock"]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[system.monitor]
enabled = true

[weather]
enabled = true
unit = "celsius"

[location]
auto_locate = true

[audio]
enable_overdrive = false
enable_sounds = false

[brightness]
enable_ddcutil = false

[plugins]
enabled = ["notoxus/os-logo"]

