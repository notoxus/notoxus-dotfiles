# Present taskbar
[bar.main]
position = "bottom"
thickness = 42
background_opacity = 0.96
border = "#3B4261"
border_width = 1.0
radius = 22
concave_edge_corners = true
margin_ends = 12
margin_edge = 0
padding = 14
widget_spacing = 8
scale = 1.0
font_scale = 1.0
font_weight = 600
shadow = true
auto_hide = false
reserve_space = true
capsule = false
start = ["os-logo", "launcher", "workspaces", "taskbar"]
center = []
end = ["network", "notifications", "volume", "battery", "clock", "control-center", "session"]

[dock]
enabled = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "session"

[widget.notifications]
hide_when_no_unread = false

[widget.notifications.actions]
left = "panel-toggle control-center notifications"

[widget.network]
show_label = false

[widget.network.actions]
left = "panel-toggle control-center network"

[widget.volume]
show_label = false
capsule = true
capsule_fill = "surface_container_high"
capsule_opacity = 0.84
capsule_radius = 14
capsule_padding = 7

[widget.volume.actions]
left = "panel-toggle control-center audio"

[widget.battery]
display_mode = "graphic"
show_label = true

[widget.battery.actions]
left = "panel-toggle control-center power"

[widget.control-center]
glyph = "chevron-up"

[widget.session]
glyph = "power"
color = "#FF000C"

[widget.media]
hide_when_no_media = true
capsule = true
capsule_fill = "#000000"
capsule_foreground = "#FFFFFF"
capsule_opacity = 1.0
capsule_padding = 6
capsule_radius = 99
min_length = 120
max_length = 150
art_size = 18
hide_artist = true
title_scroll = "on_hover"
show_progress = true

[widget.taskbar]
pinned = []
group_by_workspace = false
show_all_outputs = false
only_active_workspace = false
capsule = true
capsule_fill = "surface_container"
capsule_opacity = 0.78
capsule_radius = 12
capsule_padding = 5
icon_scale = 1.0 # 0.9
item_spacing = 6 # 4
show_window_title = false
show_active_indicator = true
active_indicator_color = "primary"
active_opacity = 1.0
inactive_opacity = 0.7 # 0.75

[widget.os-logo]
type = "notoxus/os-logo:bar"

[widget.clock]
format = "{:%H:%M:%S}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.clock.actions]
left = "panel-toggle control-center calendar"
